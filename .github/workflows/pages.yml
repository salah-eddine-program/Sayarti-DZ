name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static frontend
        run: pnpm build
      - name: Set up Expo pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          package_json_file: mobile-expo/package.json
      - name: Install Expo app dependencies
        working-directory: mobile-expo
        run: pnpm install --frozen-lockfile
      - name: Export interactive Expo web app
        working-directory: mobile-expo
        run: pnpm exec expo export --platform web --output-dir ../dist/public/sayarti-app
        env:
          EXPO_BASE_URL: /Sayarti-DZ/sayarti-app
          CI: "1"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
